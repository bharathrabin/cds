name: CI
 
"on":
  push:
  pull_request:
 
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
 
    steps:
      - name: Check out code
        uses: actions/checkout@v4
 
      - name: Configure
        run: cmake -S . -B build
 
      - name: Build
        run: cmake --build build
 
      - name: Test
        run: ctest --test-dir build --output-on-failure